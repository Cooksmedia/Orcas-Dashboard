<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Coaching Notes — Orcas Dashboard</title>
<link href="https://fonts.googleapis.com/css2?family=Teko:wght@400;500;600;700&family=Inter:wght@300;400;500;600;700;800&display=swap" rel="stylesheet">
<style>
:root{
  --void:#09090b;--panel:#111115;--panel2:#18181d;--panel3:#1e1e25;
  --rim:#28282f;--rim2:#323240;--white:#f0eee8;--off:#b8b4a8;--muted:#606070;
  --teal:#00d4c8;--teal-dim:rgba(0,212,200,.08);
  --gold:#e0b030;--gold-dim:rgba(224,176,48,.08);
  --red:#f04060;--red-dim:rgba(240,64,96,.1);
  --violet:#a060f0;--violet-dim:rgba(160,96,240,.08);
  --mint:#40d0a0;--mint-dim:rgba(64,208,160,.08);
  --orange:#f08820;--orange-dim:rgba(240,136,32,.08);
  --sky:#40b0f0;--sky-dim:rgba(64,176,240,.08);
  --head:'Teko',sans-serif;--body:'Inter',sans-serif;
}
*{box-sizing:border-box;margin:0;padding:0;}
html{scroll-behavior:smooth;}
body{background:var(--void);color:var(--white);font-family:var(--body);min-height:100vh;}

/* TOPBAR */
.topbar{background:var(--panel);border-bottom:1px solid var(--rim);padding:0 24px;height:52px;display:flex;align-items:center;justify-content:space-between;position:sticky;top:0;z-index:100;}
.tb-brand{font-family:var(--head);font-size:18px;font-weight:700;letter-spacing:2px;color:var(--teal);display:flex;align-items:center;gap:8px;}
.tb-back{font-family:var(--head);font-size:13px;font-weight:600;letter-spacing:1px;color:var(--muted);text-decoration:none;padding:7px 16px;border-radius:8px;border:1px solid var(--rim2);transition:all .2s;}
.tb-back:hover{color:var(--teal);border-color:var(--teal);}

/* LAYOUT */
.layout{display:grid;grid-template-columns:280px 1fr;min-height:calc(100vh - 52px);}
@media(max-width:768px){.layout{grid-template-columns:1fr;}}

/* SIDEBAR */
.sidebar{background:var(--panel);border-right:1px solid var(--rim);padding:20px 14px;display:flex;flex-direction:column;gap:6px;}
.sb-label{font-family:var(--head);font-size:10px;font-weight:700;letter-spacing:3px;color:var(--muted);text-transform:uppercase;padding:6px 10px;margin-top:10px;}
.sb-label:first-child{margin-top:0;}
.note-item{display:flex;align-items:center;gap:10px;padding:10px 12px;border-radius:10px;cursor:pointer;transition:all .15s;border:1px solid transparent;}
.note-item:hover{background:var(--panel2);}
.note-item.active{background:var(--panel2);border-color:var(--rim2);}
.note-item.active .ni-title{color:var(--teal);}
.ni-dot{width:8px;height:8px;border-radius:50%;flex-shrink:0;}
.ni-title{font-family:var(--head);font-size:15px;font-weight:600;letter-spacing:.5px;color:var(--off);flex:1;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;}
.ni-count{font-size:10px;color:var(--muted);font-weight:600;background:var(--panel3);padding:2px 8px;border-radius:100px;}
.add-note-btn{margin-top:auto;font-family:var(--head);font-size:14px;font-weight:700;letter-spacing:1px;background:var(--teal-dim);color:var(--teal);border:1px solid rgba(0,212,200,.25);border-radius:10px;padding:11px 16px;cursor:pointer;display:flex;align-items:center;gap:8px;transition:all .2s;width:100%;}
.add-note-btn:hover{background:rgba(0,212,200,.15);}

/* MAIN PANEL */
.main-panel{padding:28px 32px;overflow-y:auto;}
@media(max-width:768px){.sidebar{display:none;}.main-panel{padding:16px;}}

/* NOTES SECTION */
.section-header{display:flex;align-items:center;justify-content:space-between;margin-bottom:20px;padding-bottom:14px;border-bottom:1px solid var(--rim);}
.sh-title{font-family:var(--head);font-size:clamp(28px,4vw,44px);font-weight:700;letter-spacing:.5px;}
.sh-count{font-size:13px;color:var(--muted);}
.sh-btn{font-family:var(--head);font-size:13px;font-weight:700;letter-spacing:1px;padding:8px 18px;border-radius:9px;border:none;cursor:pointer;transition:all .2s;}
.sh-btn.add{background:var(--teal);color:#06231f;}
.sh-btn.add:hover{filter:brightness(1.1);}

/* NOTE CARDS */
.notes-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(300px,1fr));gap:14px;margin-bottom:32px;}
.note-card{background:var(--panel2);border:1px solid var(--rim);border-radius:14px;overflow:hidden;transition:all .2s;}
.note-card:hover{border-color:var(--rim2);box-shadow:0 4px 16px rgba(0,0,0,.2);}
.note-card.pinned{border-color:rgba(224,176,48,.3);}
.nc-top{padding:16px 18px 12px;border-bottom:1px solid var(--rim);}
.nc-tag{font-size:9px;font-weight:700;letter-spacing:2px;text-transform:uppercase;padding:2px 9px;border-radius:100px;margin-bottom:8px;display:inline-block;}
.nc-title{font-family:var(--head);font-size:19px;font-weight:700;letter-spacing:.5px;margin-bottom:4px;line-height:1.2;}
.nc-meta{font-size:11px;color:var(--muted);}
.nc-body{padding:14px 18px;font-size:13px;color:var(--off);line-height:1.7;}
.nc-body ul{padding-left:16px;margin:6px 0;}
.nc-body ul li{margin-bottom:4px;}
.nc-body strong{color:var(--white);}
.nc-body em{color:var(--teal);font-style:normal;}
.nc-footer{padding:10px 18px;border-top:1px solid var(--rim);display:flex;align-items:center;gap:8px;}
.nc-action{font-size:11px;font-weight:600;letter-spacing:1px;color:var(--muted);background:none;border:none;cursor:pointer;padding:4px 10px;border-radius:6px;transition:all .15s;}
.nc-action:hover{color:var(--white);background:var(--rim);}
.nc-pin{color:var(--gold);}

/* ADD / EDIT MODAL */
.modal-overlay{position:fixed;inset:0;background:rgba(0,0,0,.7);z-index:500;display:none;align-items:center;justify-content:center;padding:20px;}
.modal-overlay.open{display:flex;}
.modal{background:var(--panel2);border:1px solid var(--rim2);border-radius:18px;width:100%;max-width:560px;overflow:hidden;}
.modal-head{padding:20px 24px;border-bottom:1px solid var(--rim);display:flex;align-items:center;justify-content:space-between;}
.modal-title{font-family:var(--head);font-size:24px;font-weight:700;letter-spacing:.5px;}
.modal-close{background:none;border:none;color:var(--muted);font-size:22px;cursor:pointer;padding:4px 8px;border-radius:6px;}
.modal-close:hover{color:var(--white);}
.modal-body{padding:20px 24px;}
.field{margin-bottom:16px;}
.field-label{font-family:var(--head);font-size:11px;font-weight:700;letter-spacing:2px;color:var(--muted);text-transform:uppercase;margin-bottom:6px;display:block;}
.field-input,.field-select,.field-textarea{width:100%;background:var(--panel3);border:1px solid var(--rim2);border-radius:9px;color:var(--white);font-family:var(--body);font-size:14px;padding:10px 14px;outline:none;transition:border-color .2s;}
.field-input:focus,.field-select:focus,.field-textarea:focus{border-color:var(--teal);}
.field-textarea{resize:vertical;min-height:120px;line-height:1.6;}
.field-select option{background:var(--panel3);}
.modal-footer{padding:16px 24px;border-top:1px solid var(--rim);display:flex;gap:10px;justify-content:flex-end;}
.btn{font-family:var(--head);font-size:14px;font-weight:700;letter-spacing:1px;padding:10px 22px;border-radius:9px;border:none;cursor:pointer;transition:all .2s;}
.btn-teal{background:var(--teal);color:#06231f;}
.btn-teal:hover{filter:brightness(1.1);}
.btn-ghost{background:transparent;color:var(--muted);border:1px solid var(--rim2);}
.btn-ghost:hover{color:var(--white);}

/* CATEGORY FILTER PILLS */
.filter-row{display:flex;gap:8px;flex-wrap:wrap;margin-bottom:22px;}
.fpill{font-family:var(--head);font-size:12px;font-weight:700;letter-spacing:1px;padding:6px 16px;border-radius:100px;border:1px solid var(--rim2);color:var(--muted);cursor:pointer;transition:all .2s;background:none;}
.fpill:hover{color:var(--white);}
.fpill.on{color:var(--teal);border-color:var(--teal);background:var(--teal-dim);}

/* EMPTY STATE */
.empty-state{text-align:center;padding:60px 20px;color:var(--muted);}
.empty-icon{font-size:48px;margin-bottom:16px;}
.empty-text{font-family:var(--head);font-size:22px;margin-bottom:8px;color:var(--off);}
.empty-sub{font-size:14px;}

/* MOBILE TOGGLE */
.mob-sidebar-toggle{display:none;font-family:var(--head);font-size:13px;font-weight:700;letter-spacing:1px;color:var(--teal);background:var(--teal-dim);border:1px solid rgba(0,212,200,.2);border-radius:9px;padding:9px 16px;cursor:pointer;margin-bottom:14px;width:100%;}
@media(max-width:768px){.mob-sidebar-toggle{display:block;}}
</style>
</head>
<body>

<div class="topbar">
  <div class="tb-brand">📝 <span>Coaching Notes</span></div>
  <a href="dashboard.html" class="tb-back">← Dashboard</a>
</div>

<div class="layout">

  <!-- SIDEBAR -->
  <div class="sidebar" id="sidebar">
    <div class="sb-label">Categories</div>

    <div class="note-item active" onclick="filterCat('all',this)">
      <div class="ni-dot" style="background:var(--teal)"></div>
      <div class="ni-title">All Notes</div>
      <div class="ni-count" id="cnt-all">0</div>
    </div>
    <div class="note-item" onclick="filterCat('defense',this)">
      <div class="ni-dot" style="background:var(--sky)"></div>
      <div class="ni-title">Defense</div>
      <div class="ni-count" id="cnt-defense">0</div>
    </div>
    <div class="note-item" onclick="filterCat('offense',this)">
      <div class="ni-dot" style="background:var(--mint)"></div>
      <div class="ni-title">Offense</div>
      <div class="ni-count" id="cnt-offense">0</div>
    </div>
    <div class="note-item" onclick="filterCat('player',this)">
      <div class="ni-dot" style="background:var(--violet)"></div>
      <div class="ni-title">Player Notes</div>
      <div class="ni-count" id="cnt-player">0</div>
    </div>
    <div class="note-item" onclick="filterCat('drill',this)">
      <div class="ni-dot" style="background:var(--orange)"></div>
      <div class="ni-title">Drills</div>
      <div class="ni-count" id="cnt-drill">0</div>
    </div>
    <div class="note-item" onclick="filterCat('game',this)">
      <div class="ni-dot" style="background:var(--gold)"></div>
      <div class="ni-title">Game Day</div>
      <div class="ni-count" id="cnt-game">0</div>
    </div>
    <div class="note-item" onclick="filterCat('general',this)">
      <div class="ni-dot" style="background:var(--muted)"></div>
      <div class="ni-title">General</div>
      <div class="ni-count" id="cnt-general">0</div>
    </div>

    <button class="add-note-btn" onclick="openModal()">+ Add New Note</button>
  </div>

  <!-- MAIN PANEL -->
  <div class="main-panel">
    <button class="mob-sidebar-toggle" onclick="document.getElementById('sidebar').style.display=document.getElementById('sidebar').style.display==='block'?'none':'block'">☰ Categories</button>

    <div class="section-header">
      <div>
        <div class="sh-title" id="section-title" style="color:var(--teal)">All Notes</div>
        <div class="sh-count" id="section-count"></div>
      </div>
      <button class="sh-btn add" onclick="openModal()">+ Add Note</button>
    </div>

    <div class="filter-row">
      <button class="fpill on" onclick="filterCat('all',null,this)">All</button>
      <button class="fpill" onclick="filterCat('defense',null,this)">🛡️ Defense</button>
      <button class="fpill" onclick="filterCat('offense',null,this)">⚡ Offense</button>
      <button class="fpill" onclick="filterCat('player',null,this)">👤 Players</button>
      <button class="fpill" onclick="filterCat('drill',null,this)">🔁 Drills</button>
      <button class="fpill" onclick="filterCat('game',null,this)">🏐 Game Day</button>
      <button class="fpill" onclick="filterCat('general',null,this)">📋 General</button>
    </div>

    <div class="notes-grid" id="notes-grid"></div>
  </div>
</div>

<!-- ADD/EDIT MODAL -->
<div class="modal-overlay" id="modal">
  <div class="modal">
    <div class="modal-head">
      <div class="modal-title" id="modal-title">New Note</div>
      <button class="modal-close" onclick="closeModal()">✕</button>
    </div>
    <div class="modal-body">
      <input type="hidden" id="edit-id">
      <div class="field">
        <label class="field-label">Title</label>
        <input class="field-input" id="note-title" placeholder="e.g. Perimeter Defense Reminder" maxlength="80">
      </div>
      <div class="field">
        <label class="field-label">Category</label>
        <select class="field-select" id="note-cat">
          <option value="defense">🛡️ Defense</option>
          <option value="offense">⚡ Offense</option>
          <option value="player">👤 Player Notes</option>
          <option value="drill">🔁 Drills</option>
          <option value="game">🏐 Game Day</option>
          <option value="general">📋 General</option>
        </select>
      </div>
      <div class="field">
        <label class="field-label">Notes</label>
        <textarea class="field-textarea" id="note-body" placeholder="Write your coaching notes here...&#10;&#10;Tip: Use a dash (-) at the start of a line to create a bullet point."></textarea>
      </div>
    </div>
    <div class="modal-footer">
      <button class="btn btn-ghost" onclick="closeModal()">Cancel</button>
      <button class="btn btn-teal" onclick="saveNote()">Save Note</button>
    </div>
  </div>
</div>

<script>
// ── CATEGORY CONFIG ──
const CATS = {
  defense: {label:'Defense',      color:'var(--sky)',    icon:'🛡️'},
  offense: {label:'Offense',      color:'var(--mint)',   icon:'⚡'},
  player:  {label:'Player Notes', color:'var(--violet)', icon:'👤'},
  drill:   {label:'Drills',       color:'var(--orange)', icon:'🔁'},
  game:    {label:'Game Day',     color:'var(--gold)',   icon:'🏐'},
  general: {label:'General',      color:'var(--muted)',  icon:'📋'},
};

// ── STORAGE ──
function loadNotes(){
  try{ return JSON.parse(localStorage.getItem('orca_coach_notes')||'[]'); }
  catch(e){ return []; }
}
function saveNotes(notes){
  localStorage.setItem('orca_coach_notes', JSON.stringify(notes));
}

// ── STATE ──
let currentCat = 'all';
let editId = null;

// ── RENDER ──
function render(){
  const notes = loadNotes();
  const filtered = currentCat === 'all' ? notes : notes.filter(n=>n.cat===currentCat);
  // Pinned first
  filtered.sort((a,b)=> (b.pinned?1:0)-(a.pinned?1:0) || b.ts-a.ts);

  const grid = document.getElementById('notes-grid');
  if(!filtered.length){
    grid.innerHTML = `<div class="empty-state" style="grid-column:1/-1">
      <div class="empty-icon">📝</div>
      <div class="empty-text">No notes yet</div>
      <div class="empty-sub">Click "+ Add Note" to create your first coaching note</div>
    </div>`;
  } else {
    grid.innerHTML = filtered.map(n=>noteCard(n)).join('');
  }

  // Update counts
  updateCounts(notes);
  document.getElementById('section-count').textContent =
    filtered.length + ' note' + (filtered.length!==1?'s':'');
}

function noteCard(n){
  const cat = CATS[n.cat] || CATS.general;
  const date = new Date(n.ts).toLocaleDateString('en-US',{month:'short',day:'numeric',year:'numeric'});
  // Format body — turn "- item" lines into bullet list
  let body = n.body || '';
  // Convert markdown-style bullets
  const lines = body.split('\n');
  let html = '';
  let inList = false;
  for(const line of lines){
    if(line.trim().startsWith('- ')||line.trim().startsWith('• ')){
      if(!inList){html+='<ul>';inList=true;}
      html+=`<li>${line.trim().slice(2)}</li>`;
    } else {
      if(inList){html+='</ul>';inList=false;}
      if(line.trim()) html+=`<p style="margin-bottom:4px;">${line}</p>`;
    }
  }
  if(inList) html+='</ul>';

  return `<div class="note-card${n.pinned?' pinned':''}">
    <div class="nc-top">
      <span class="nc-tag" style="background:rgba(${catRgb(n.cat)},.15);color:${cat.color};">${cat.icon} ${cat.label}</span>
      ${n.pinned?'<span style="float:right;color:var(--gold);font-size:14px;">📌</span>':''}
      <div class="nc-title">${n.title||'Untitled Note'}</div>
      <div class="nc-meta">${date}</div>
    </div>
    <div class="nc-body">${html}</div>
    <div class="nc-footer">
      <button class="nc-action" onclick="editNote('${n.id}')">✏️ Edit</button>
      <button class="nc-action nc-pin" onclick="togglePin('${n.id}')">${n.pinned?'📌 Unpin':'📌 Pin'}</button>
      <button class="nc-action" style="margin-left:auto;color:var(--red);" onclick="deleteNote('${n.id}')">🗑️ Delete</button>
    </div>
  </div>`;
}

function catRgb(cat){
  const map={defense:'64,176,240',offense:'64,208,160',player:'160,96,240',drill:'240,136,32',game:'224,176,48',general:'96,96,112'};
  return map[cat]||'96,96,112';
}

function updateCounts(notes){
  document.getElementById('cnt-all').textContent = notes.length;
  Object.keys(CATS).forEach(c=>{
    const el=document.getElementById('cnt-'+c);
    if(el) el.textContent = notes.filter(n=>n.cat===c).length;
  });
}

// ── FILTER ──
function filterCat(cat, sidebarItem, pillItem){
  currentCat = cat;
  // Update sidebar active
  if(sidebarItem){
    document.querySelectorAll('.note-item').forEach(i=>i.classList.remove('active'));
    sidebarItem.classList.add('active');
  }
  // Update pills
  if(pillItem){
    document.querySelectorAll('.fpill').forEach(p=>p.classList.remove('on'));
    pillItem.classList.add('on');
  }
  // Update title
  const titles={all:'All Notes',defense:'Defense',offense:'Offense',player:'Player Notes',drill:'Drills',game:'Game Day',general:'General'};
  document.getElementById('section-title').textContent = titles[cat]||'Notes';
  render();
}

// ── MODAL ──
function openModal(prefillCat){
  editId = null;
  document.getElementById('modal-title').textContent='New Note';
  document.getElementById('note-title').value='';
  document.getElementById('note-cat').value = prefillCat||currentCat||'defense';
  document.getElementById('note-body').value='';
  document.getElementById('modal').classList.add('open');
  document.getElementById('note-title').focus();
}
function closeModal(){
  document.getElementById('modal').classList.remove('open');
  editId=null;
}
function editNote(id){
  const notes=loadNotes();
  const n=notes.find(x=>x.id===id);
  if(!n)return;
  editId=id;
  document.getElementById('modal-title').textContent='Edit Note';
  document.getElementById('note-title').value=n.title||'';
  document.getElementById('note-cat').value=n.cat||'general';
  document.getElementById('note-body').value=n.body||'';
  document.getElementById('modal').classList.add('open');
}
function saveNote(){
  const title=document.getElementById('note-title').value.trim();
  const cat=document.getElementById('note-cat').value;
  const body=document.getElementById('note-body').value.trim();
  if(!title&&!body){alert('Please add a title or some content.');return;}
  const notes=loadNotes();
  if(editId){
    const idx=notes.findIndex(n=>n.id===editId);
    if(idx>-1){notes[idx]={...notes[idx],title,cat,body,updated:Date.now()};}
  } else {
    notes.unshift({id:'n'+Date.now(),title,cat,body,pinned:false,ts:Date.now()});
  }
  saveNotes(notes);
  closeModal();
  render();
}
function deleteNote(id){
  if(!confirm('Delete this note?'))return;
  const notes=loadNotes().filter(n=>n.id!==id);
  saveNotes(notes);
  render();
}
function togglePin(id){
  const notes=loadNotes();
  const n=notes.find(x=>x.id===id);
  if(n) n.pinned=!n.pinned;
  saveNotes(notes);
  render();
}

// ── SEED PRE-LOADED NOTES from the coaching content ──
function seedNotes(){
  const existing = loadNotes();
  if(existing.length > 0) return; // Don't overwrite if notes already exist

  const seeded = [
    {
      id:'seed1', cat:'defense', pinned:true, ts:Date.now()-5000,
      title:'Perimeter Defense — Key Reads (3 Pre-Contact)',
      body:`- Read 1: Set height & location — tight set = tip likely, high outside = full range of options
- Read 2: Hitter's shoulder at peak — square to net = cross-court, turned to line = line shot. Call it out loud before contact: "LINE!" or "CROSS!"
- Read 3: The Block — if block seals the line, Z1 shades toward the seam. Gap in the block = Z6 fills it
- The Freeze Rule: Stop moving the moment the hitter contacts the ball. Read → adjust → FREEZE → explode to the ball`
    },
    {
      id:'seed2', cat:'defense', pinned:false, ts:Date.now()-4000,
      title:'Z1 / Z5 Flip Rule — Outside vs Right-Side Attack',
      body:`Golden Rule: Whoever is on the ATTACK SIDE owns the LINE.

Set goes LEFT (Zone 4 Outside):
- Z1 (Right Back) → drops deep RIGHT corner — owns the LINE
- Z5 (Libero) → slides inside blocker's hands — covers CROSS-COURT

Set goes RIGHT (Zone 2 Right-Side):
- Z5 (Libero) → drops deep LEFT corner — NOW owns the LINE
- Z1 (Right Back) → slides inside toward center — covers CROSS-COURT

This flip is the #1 mistake in perimeter defense. Quiz it verbally every practice until it's automatic.`
    },
    {
      id:'seed3', cat:'defense', pinned:false, ts:Date.now()-3000,
      title:'Tip Defense — Off-Blocker Responsibilities',
      body:`- Off-blocker (non-blocking front-row player) drops to the 10-FOOT LINE — not deep, not at the net
- Watch the hitter's ELBOW — if the elbow drops during the arm swing, it's a tip
- Call "TIP!" loud enough for Z6 to hear
- Z6 does NOT move forward until the off-blocker calls it
- On a left-side attack: Z2 (right front) covers right-front tip zone
- On a right-side attack: Z4 (left front) covers left-front tip zone`
    },
    {
      id:'seed4', cat:'drill', pinned:false, ts:Date.now()-2500,
      title:'Perimeter Read Drill — Setup & Focus',
      body:`Setup: 3 defenders in back row (Z1, Z5, Z6). Coach on opposite side with ball.

Action: 
- Coach tosses high to simulate a set (left or right)
- Defenders shift from base depth to perimeter spots
- Coach slaps ball — defenders FREEZE in low athletic stance

Focus: Back-row players must be stationary BEFORE the attacker hits. Moving at contact = can't react in time.

Progression: Start slow (walk through), then add live attacks after positions are automatic.`
    },
