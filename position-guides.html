fetch('player-portal-all.html').then(r=>r.text()).then(t=>{const d=new DOMParser().parseFromString(t,'text/html');d.querySelectorAll('style').forEach(s=>document.head.appendChild(s.cloneNode(true)));const sec=d.querySelector('#positions');const m=document.getElementById('mount');m.innerHTML='';if(sec)m.appendChild(sec.cloneNode(true));else m.innerHTML='<p>Section unavailable.</p>';});
